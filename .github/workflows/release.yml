name: Release

# Tag-triggered, because the second hand-published version is how versions drift. The tag is the
# record of what was released; `version:check` in CI guarantees it matches the manifests.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Pack and inspect, publish nothing"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: "24"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The same gates as CI. A release that skips them is a release nobody checked.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm catalog:check
      - run: pnpm docs:check
      - run: pnpm version:check
      - run: pnpm portability:core

      - name: The tag must be the version being published
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(node -p "require('./packages/cli/package.json').version")
          test "$tag" = "$manifest" || {
            echo "tag $tag does not match packages/cli/package.json ($manifest)" >&2
            exit 1
          }

      # One package (`NEED-47`): `packages/core` is private and is bundled into the command by
      # `prepack`, so there is nothing to publish before this and nothing to order against.
      - name: Publish brazecli
        if: ${{ github.event_name == 'push' || inputs.dry-run == false }}
        run: pnpm --filter brazecli publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: pnpm --filter brazecli publish --dry-run --no-git-checks
