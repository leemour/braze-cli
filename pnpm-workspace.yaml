packages:
  - packages/*

# pnpm 11 blocks dependencies' install scripts by default. Without this, esbuild never
# unpacks its platform binary and lefthook never installs the git hooks — both fail quietly
# with a warning, not an error. The setting moved here from package.json's `pnpm` key in
# pnpm 11; left there it is silently ignored.
onlyBuiltDependencies:
  - esbuild
  - lefthook
